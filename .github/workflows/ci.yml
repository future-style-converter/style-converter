# Style Converter CI — the fast, always-runnable gate.
#
# Deliberately minimal for the reboot: three deterministic jobs that need no
# emulator, no simulator, no GPU. Device-level visual jobs (Android emulator
# screenshots, iOS simulator captures, full SSIM matrix) arrive as a separate
# promotion workflow once the runtimes/ restructure lands.
name: ci

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  converter:
    name: converter (Kotlin)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests
        run: ./gradlew :converter:test --no-daemon
      - name: CLI honesty — --to ir succeeds, --to compose fails loudly
        run: |
          ./gradlew :converter:run --no-daemon --args="convert --from css --to ir -i fixtures/visual-test.json -o out"
          test -s out/tmpOutput.json
          if ./gradlew :converter:run --no-daemon --args="convert --from css --to compose -i fixtures/visual-test.json -o out" 2>/dev/null; then
            echo "::error::--to compose must exit non-zero until the writer exists" ; exit 1
          fi

  web-runtime:
    name: web runtime (TypeScript)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm, cache-dependency-path: package-lock.json }
      # Root npm ci installs both workspaces (runtimes/web + apps/web-harness).
      # Skip puppeteer's Chromium download — the unit suites never launch a browser.
      - run: PUPPETEER_SKIP_DOWNLOAD=1 npm ci
      - name: Typecheck both workspaces
        run: npm -ws run typecheck --if-present
      - name: Unit tests — engine (@style-converter/web) + harness (web-harness)
        run: npm -ws run test --if-present

  test-tooling:
    name: test tooling (node)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm, cache-dependency-path: package-lock.json }
      # tools/ is an npm workspace now — the single root lockfile covers it.
      - name: Install (skip puppeteer chrome download — unit tests never launch a browser)
        run: PUPPETEER_SKIP_DOWNLOAD=1 npm ci
      - name: Unit tests
        run: node --test tools/visual/*.test.mjs tools/titan/*.test.mjs
