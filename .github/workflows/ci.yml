# Style Converter CI — the fast, always-runnable gate.
#
# Deliberately minimal for the reboot: three deterministic jobs that need no
# emulator, no simulator, no GPU. Device-level visual jobs (Android emulator
# screenshots, iOS simulator captures, full SSIM matrix) arrive as a separate
# promotion workflow once the runtimes/ restructure lands.
name: ci

# Least-privilege default for every job (CodeQL actions/missing-workflow-permissions).
permissions:
  contents: read

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  converter:
    name: converter (Kotlin)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '21' }
      - uses: gradle/actions/setup-gradle@v6
      - name: Unit tests
        run: ./gradlew :converter:test --no-daemon
      - name: CLI honesty — --to ir succeeds, --to compose fails loudly
        run: |
          ./gradlew :converter:run --no-daemon --args="convert --from css --to ir -i fixtures/visual-test.json -o out"
          test -s out/tmpOutput.json
          if ./gradlew :converter:run --no-daemon --args="convert --from css --to compose -i fixtures/visual-test.json -o out" 2>/dev/null; then
            echo "::error::--to compose must exit non-zero until the writer exists" ; exit 1
          fi

  web-runtime:
    name: web runtime (TypeScript)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      # setup-node v6: automatic lockfile-based caching is npm-only now; our
      # explicit `cache: npm` + dependency-path pin predates that and still works.
      - uses: actions/setup-node@v6
        with: { node-version: 24, cache: npm, cache-dependency-path: package-lock.json }
      # Root npm ci installs both workspaces (runtimes/web + apps/web-harness).
      # Skip puppeteer's Chromium download — the unit suites never launch a browser.
      - run: PUPPETEER_SKIP_DOWNLOAD=1 npm ci
      - name: Typecheck both workspaces
        run: npm -ws run typecheck --if-present
      - name: Unit tests — engine (@style-converter/web) + harness (web-harness)
        run: npm -ws run test --if-present

  schema-conformance:
    # The IR wire format is a contract (schema/): validate the golden
    # fixtures AND a freshly-converted visual-test artifact against
    # schema/ir-v1.schema.json. The per-platform conformance suites ride
    # their existing jobs automatically (converter → :converter:test,
    # web → the vitest run in web-runtime); the Compose and SwiftUI
    # conformance tests need Android/Xcode toolchains and run locally
    # (apps/android-harness gradlew testDebugUnitTest, xcodebuild test
    # -scheme StyleConverterRuntime) until the device-level workflow lands.
    name: schema conformance (IR v1)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '21' }
      - uses: gradle/actions/setup-gradle@v6
      - uses: actions/setup-node@v6
        with: { node-version: 24, cache: npm, cache-dependency-path: package-lock.json }
      # ajv lives in the tools workspace; the root lockfile covers it.
      - name: Install (skip puppeteer chrome download)
        run: PUPPETEER_SKIP_DOWNLOAD=1 npm ci
      - name: Runner self-test
        run: node --test schema/conformance/run.test.mjs
      - name: Convert visual-test fixture and validate artifact + goldens
        run: node schema/conformance/run.mjs --emit

  test-tooling:
    name: test tooling (node)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with: { node-version: 24, cache: npm, cache-dependency-path: package-lock.json }
      # tools/ is an npm workspace now — the single root lockfile covers it.
      - name: Install (skip puppeteer chrome download — unit tests never launch a browser)
        run: PUPPETEER_SKIP_DOWNLOAD=1 npm ci
      - name: Unit tests
        run: node --test tools/visual/*.test.mjs tools/titan/*.test.mjs

  doc-staleness:
    # Device-less doc-drift gate. tools/visual/doc-staleness-check.sh derives
    # every headline number in README.md / CLAUDE.md / docs/STATUS.md (and the
    # runtimes/*/README.md + apps/android-harness/README.md test-suite tables)
    # from live source-of-truth — coverage-audit.mjs (registered/real totals), a
    # real web vitest run, the tooling `node --test` suite, and grep-counted
    # JUnit/XCTest declarations — and fails if any doc-quoted number drifted.
    # This is the same script smoke.sh runs locally; hoisting it into CI stops
    # doc drift from accumulating unenforced. Needs only node + the repo (the
    # Kotlin/Swift suites are counted by grep, not run, so no JDK/Xcode here).
    name: doc staleness (node)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with: { node-version: 24, cache: npm, cache-dependency-path: package-lock.json }
      # The check runs a real web vitest run + the tooling node --test suite, so
      # both workspaces' deps must be installed. Skip puppeteer's Chromium
      # download — neither path launches a browser.
      - name: Install (skip puppeteer chrome download)
        run: PUPPETEER_SKIP_DOWNLOAD=1 npm ci
      - name: Doc-staleness check (headline numbers vs live source-of-truth)
        run: bash tools/visual/doc-staleness-check.sh

  compose-conformance:
    # Native decoder gate. The node/ajv schema-conformance job above validates
    # the goldens against the JSON Schema + the converter's emit, and the web
    # runtime decodes them in its vitest job — but the COMPOSE (Kotlin) decoder
    # was local-only, so an additive-envelope-key change the Kotlin load path
    # rejects (exactly the wave-8 doc-level `keyframes` key that once broke
    # converter conformance) would sail through every existing job and only
    # surface on-device. SchemaConformanceTest decodes all 31 golden IR docs
    # through the REAL load path. testDebugUnitTest is JVM-only — NO emulator —
    # so it runs on ubuntu-latest (which ships the Android SDK gradle finds via
    # $ANDROID_HOME/$ANDROID_SDK_ROOT). schema/ + fixtures/ are declared
    # test-task inputs (wave-9 fix), so a golden change can't cache-green here.
    name: compose conformance (JVM)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '21' }
      - uses: gradle/actions/setup-gradle@v6
      - name: Compose runtime — IR conformance decode (31 goldens)
        run: cd apps/android-harness && ./gradlew :runtime:testDebugUnitTest --tests '*SchemaConformanceTest*' --no-daemon

  swiftui-conformance:
    # Native decoder gate for the SwiftUI runtime — same rationale as
    # compose-conformance. The runtime imports UIKit, so plain `swift test`
    # fails with "no such module 'UIKit'"; it must build under Mac Catalyst,
    # hence a macOS runner + xcodebuild (matching the local suite command).
    # -only-testing scopes to the conformance class so the gate stays lean.
    name: swiftui conformance (Catalyst)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: SwiftUI runtime — IR conformance decode (31 goldens)
        run: >-
          xcodebuild test
          -scheme StyleConverterRuntime
          -destination 'platform=macOS,variant=Mac Catalyst,arch=arm64'
          -only-testing:StyleConverterRuntimeTests/ConformanceTests
