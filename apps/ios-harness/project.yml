# XcodeGen config — generates StyleConverterTest.xcodeproj from this file.
#
# Regenerate the project:
#     cd apps/ios-harness && xcodegen generate
#
# Install XcodeGen if missing:
#     brew install xcodegen

name: StyleConverterTest
options:
  bundleIdPrefix: com.styleconverter
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

# The runtime style engine (StyleEngine + Models + Renderer) is consumed as
# a local SwiftPM package. Its manifest sits at the REPO ROOT (Package.swift)
# with sources under runtimes/swiftui/ — hence path: ../.. from this folder.
packages:
  StyleConverterRuntime:
    path: ../..

settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGNING_ALLOWED: NO

targets:
  StyleConverterTest:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      # Harness-only chrome: App entry, UI gallery, Screenshot capture.
      # The engine trees (StyleEngine/, Models/, Renderer/) moved into the
      # StyleConverterRuntime package — do not re-add them here.
      - path: StyleConverterTest
        excludes:
          - "Info.plist"
          - "**/README.md"
    dependencies:
      # Link the runtime engine product from the local package above.
      - package: StyleConverterRuntime
        product: StyleConverterRuntime
    resources:
      - StyleConverterTest/Resources
      - StyleConverterTest/Assets.xcassets
    info:
      path: StyleConverterTest/Info.plist
      properties:
        CFBundleDisplayName: Style Converter
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.styleconverter.test
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Pin the platform set so a test SCHEME's buildable-platform
        # intersection (app + local SwiftPM package) is non-empty under
        # Xcode 26 — otherwise xcodebuild test refuses every destination.
        # Includes iphonesimulator so the `-target` app build the feeder
        # uses (test-all.sh's contract) is unaffected.
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"

  # TITAN Phase 3 — device-free unit tests for the inbox-mode app logic
  # (activation-flag parse + FIFO poll ordering). Hosted by the app target so
  # `@testable import StyleConverterTest` resolves; run with:
  #   xcodebuild test -project StyleConverterTest.xcodeproj \
  #     -scheme StyleConverterTestTests -destination 'platform=iOS Simulator,...'
  # The end-to-end capture path is proven separately by tools/titan/feed-ios.mjs.
  StyleConverterTestTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: StyleConverterTestTests
      # Wave 53 (harness-hygiene T1-a): the files the source-scan and verbatim-
      # wire pins read ride INSIDE the test bundle. The bundle runs in the
      # simulator, which is refused a read of the host checkout under
      # ~/Documents (NSCocoaErrorDomain 257 / EPERM on every `#filePath` read:
      # 9 of the 13 failures of 2026-10-06), so the tests load these through
      # `Bundle(for:)` instead. Each entry below lands in a phase of THIS
      # target only; the app target still compiles CaptureCanvas.swift from
      # its folder source above and never sees these copies (the gate builds
      # `-target StyleConverterTest`).
      # A Copy FILES phase into the bundle's resources, not `buildPhase:
      # resources`: Xcode refuses a .swift file in Copy Bundle Resources
      # ("cannot be processed by a Copy Bundle Resources build phase" — the
      # file is silently left out; measured in wave 53), while Copy Files
      # copies it byte-identical (dstSubfolderSpec 7 = Resources).
      - path: StyleConverterTest/Screenshot/CaptureCanvas.swift
        buildPhase:
          copyFiles:
            destination: resources
      # The two verbatim per-test IR documents of ComposedRootInlineFlowTests
      # (tools/titan/fixtures/README.md carries their provenance).
      - path: ../../tools/titan/fixtures/per-test-ir/wave49-final/CSS2/wpt__CSS2__abspos__static-inside-inline-block.json
        buildPhase: resources
      - path: ../../tools/titan/fixtures/per-test-ir/wave49-final/css-cascade/wpt__css-cascade__scope-pseudo-element.json
        buildPhase: resources
    dependencies:
      # Host inside the app so the test bundle can @testable import it.
      - target: StyleConverterTest
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.styleconverter.test.tests
        # Pin the platform set explicitly. Without this the scheme's
        # buildable-platform intersection (app + local SwiftPM package)
        # computes empty under Xcode 26 and xcodebuild refuses every
        # simulator destination ("Supported platforms … is empty").
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        SDKROOT: iphoneos

# Explicit shared scheme so `xcodebuild test` resolves a simulator
# destination (xcodebuild's auto-created scheme computes an empty platform
# set with the local SwiftPM package under Xcode 26).
schemes:
  StyleConverterTestTests:
    build:
      targets:
        StyleConverterTest: [test]
        StyleConverterTestTests: [test]
    test:
      targets:
        - StyleConverterTestTests
      gatherCoverageData: false
