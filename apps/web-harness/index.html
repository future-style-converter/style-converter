<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Style Converter - Web Testing</title>
    <style>
      /* Inter — bundled and forced as the default font on every platform
       * (iOS / Android / web) so cross-platform SSIM isn't capped by
       * default-font divergence (SF Pro vs Roboto vs Chromium-default).
       * Loaded from /fonts/Inter-*.ttf which Vite serves from the public
       * directory at the same path. */
      @font-face {
        font-family: 'Inter';
        font-style: normal;
        font-weight: 400;
        font-display: block;
        src: url('/fonts/Inter-Regular.ttf') format('truetype');
      }
      @font-face {
        font-family: 'Inter';
        font-style: normal;
        font-weight: 500;
        font-display: block;
        src: url('/fonts/Inter-Medium.ttf') format('truetype');
      }
      @font-face {
        font-family: 'Inter';
        font-style: normal;
        font-weight: 700;
        font-display: block;
        src: url('/fonts/Inter-Bold.ttf') format('truetype');
      }
      @font-face {
        font-family: 'Inter';
        font-style: normal;
        font-weight: 900;
        font-display: block;
        src: url('/fonts/Inter-Black.ttf') format('truetype');
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      /* WPT mode override (F-G-HARNESS swarm-003 fix for
       * css-backgrounds__background-clip-009 and the wider css-backgrounds /
       * css-borders / css-sizing structural-divergence cluster). When the
       * capture URL carries `?wpt=1`, App.tsx adds `wpt-mode` to <body> in
       * addition to `capture-mode`. The CSS Backgrounds and Borders L3 §3.7
       * specification (`background-clip: border-box`) — and every other WPT
       * test built against the spec — assumes the browser-default box-sizing
       * of `content-box` (CSS2.1 §10.2). The universal-selector reset above
       * is load-bearing for the legacy 327-pair visual-test fixtures, but it
       * poisons any WPT test that combines a small / zero `width` with
       * non-trivial border or padding: `width: 0; border: 48px solid` MUST
       * produce a 96px outer box per the spec, but under border-box it
       * collapses to 0px wide and the background paints nothing.
       *
       * Scope: only `[data-component-id]` descendants — that's the set of
       * SDUI-rendered IR elements (every ComponentRenderer-emitted <div>
       * carries this attribute). The capture-canvas chrome wrapper, the
       * gallery scaffold, and the React app's own header / search / etc.
       * are unaffected because they do not carry `[data-component-id]`. */
      body.wpt-mode [data-component-id],
      body.wpt-mode [data-component-id] * {
        box-sizing: content-box;
      }
      /* WPT COMPOSED mode override (Round-4 TITAN GAP 1 — UA default margins).
       * When the capture URL carries `?wptComposed=1`, App.tsx adds
       * `wpt-composed-mode` to <body>. The browser-ref (capture-browser-ref.mjs)
       * renders each WPT reference page with the FULL UA stylesheet intact —
       * so a <p> bar keeps its 1em (≈16px) block margins and adjacent bars
       * collapse to a real ~16px gap. Our composed capture renders the same
       * bars as <p data-component-id> elements, but the universal `* { margin:
       * 0 }` reset above zeroes those UA margins → the bars render FLUSH and a
       * 10-bar test (background-color-hsl-001 etc.) scores far below the ref.
       *
       * Fix: on the IR-rendered elements ONLY (`[data-component-id]` and their
       * descendants), roll the margin cascade back to the user-agent origin
       * with `margin: revert`. `revert` restores the exact UA default per tag
       * — 1em block margins for <p>/<h*>, the list margins for <ul>/<ol>, 0 for
       * <div>/<span> — reproducing the ref's native layout. IR-declared margins
       * still win: they arrive as INLINE styles (higher priority than this
       * stylesheet rule), so a component that sets its own margin is unaffected
       * — only the UA default is restored where the IR is silent.
       *
       * Scope: `wpt-composed-mode` is set ONLY under `?wptComposed=1`, so the
       * legacy per-component WPT path (`?wpt=1` alone) and the committed
       * 327-pair visual baseline (no WPT class at all) keep the flush reset. */
      body.wpt-composed-mode [data-component-id],
      body.wpt-composed-mode [data-component-id] * {
        margin: revert;
        /* padding + box-sizing revert (wave-21 css-ui appearance diagnosis).
         * The browser-ref renders raw WPT pages with the FULL UA stylesheet,
         * so native form controls keep their UA padding (button 1px 6px,
         * input 1px 2px, textarea 2px, select…) and their UA
         * `box-sizing: border-box`. Our composed capture renders the same
         * controls as sourceTag-preserved native elements, but the universal
         * `* { padding: 0 }` reset stripped that padding and the wpt-mode
         * `box-sizing: content-box` override replaced the controls'
         * border-box — every widget rendered tighter than the ref (narrower
         * buttons, shorter rows, cumulative upward drift), a flat 3.96%
         * pixel penalty across the five appearance-alias tests sharing
         * appearance-auto-ref.html. `revert` rolls both back to the UA
         * origin per element: controls regain padding + border-box, while
         * plain divs/spans keep 0 padding and (via revert → initial)
         * content-box — the exact value the wpt-mode box-sizing fix wanted,
         * expressed faithfully. Cascade order: this rule is declared AFTER
         * the wpt-mode content-box rule, so at equal specificity it wins in
         * composed mode; the per-component `?wpt=1`-only path and the
         * 327-pair baseline are untouched. IR-declared padding still wins
         * (inline style). NOTE: ul/ol also regain their UA
         * padding-inline-start — matching the ref, but a corpus-wide score
         * shift on list-rendering composed tests. Verified: appearance-auto/
         * button/checkbox/listbox/menulist 0.00% vs ref after this rule. */
        padding: revert;
        box-sizing: revert;
      }
      html, body {
        width: 100%;
        height: 100%;
        background: #111;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
        color: #eee;
        overflow: hidden;
      }
      body {
        display: flex;
        justify-content: center;
        padding-top: 20px;
      }
      #root {
        width: 390px;
        max-width: 390px;
        min-width: 390px;
        height: 844px;
        overflow-y: auto;
        overflow-x: hidden;
        background: #1a1a2e;
        border: 1px solid rgba(255,255,255,0.15);
        border-radius: 12px;
      }
      /* Capture mode: a flat list of chromeless canvases with NO phone-frame
       * border, rounded corners, or scroll container. The CaptureGallery JS
       * toggles `<body class="capture-mode">` before the first paint. */
      body.capture-mode {
        padding-top: 0;
        justify-content: flex-start;
        overflow: visible;
      }
      body.capture-mode,
      body.capture-mode html {
        background: #1a1a2e;
        height: auto;
      }
      body.capture-mode #root {
        width: 390px;
        min-width: 390px;
        max-width: 390px;
        height: auto;
        overflow: visible;
        border: none;
        border-radius: 0;
        background: #1a1a2e;
      }
      /* WPT capture stage — the corpus-v4 WHITE canvas. WPT reftests are
       * authored against the spec-default white page: white ink (borders,
       * backgrounds) is supposed to VANISH into the canvas, and the
       * browser-ref (capture-browser-ref.mjs CANVAS_BG) renders white too.
       * The dark stage above made that ink visible only in our captures —
       * a systematic reftest penalty. `wpt-mode` / `wpt-composed-mode` are
       * added by App.tsx ONLY under `?wpt=1` / `?wptComposed=1`, so the
       * legacy 327-pair capture path (bare `capture-mode`) keeps the dark
       * #1a1a2e stage byte-identically. Declared AFTER the capture-mode
       * rules so equal-specificity cascade order makes white win when both
       * classes are present.
       *
       * Default text `color` — the corpus-v4.1 BLACK-ink sub-boundary. Real
       * WPT pages paint default prose in the UA `color: CanvasText` BLACK;
       * through corpus-v4.0 both sides of the diff kept the near-white
       * harness family (`body { color: #eee }` above + the ref injection's
       * old `color:#fff`), so default-ink text tests matched VACUOUSLY —
       * neither side showed the text on the white canvas. From v4.1 the
       * WPT stage overrides the body's #eee with the spec black, in
       * lock-step with the ref injection (capture-browser-ref.mjs now
       * injects `:where(body) { color:#000 }`) and the native WPT-mode
       * bottom-outs (Compose WPT_DEFAULT_TEXT_INK, SwiftUI
       * WPTCanvas.textInk). Inheritance-based ink only: an IR-declared
       * color arrives as an inline style and still wins. The 327-pair
       * stage keeps `color: #eee` byte-identically (no wpt class → this
       * rule never applies).
       *
       * Default `font-family` — the FONT half of the same corpus-v4.1
       * sub-boundary. The browser-ref injection
       * (capture-browser-ref.mjs REF_FONT_STACK) pins this exact stack on
       * the ref's body (with the harness Inter faces embedded as data
       * URIs) so ref prose and harness prose hit the SAME face and wrap
       * at the SAME points — Chromium's default serif vs our Inter sans
       * shifted every wrap point and everything below the prose (the
       * a98rgb cluster's whole failure). The rule is a deliberate RE-PIN
       * of the global html/body stack above: redundant today via
       * inheritance, but it locks the WPT surface to the ref contract so
       * a future change to the global rule cannot silently detach them
       * (wpt-white-canvas.test.mjs compares both strings to
       * REF_FONT_STACK byte-for-byte).
       *
       * Default `line-height` — the LINE-HEIGHT leg of the corpus-v4.1
       * sub-boundary. With ink and face pinned, ref-vs-capture prose still
       * diverged in VERTICAL RHYTHM: the ref's `line-height: normal` Inter
       * box (~20px @16px; default paragraphs advance 36px top-to-top)
       * against our Round-4 calibrated ~18px box — 2px of compounding
       * drift per paragraph (the whole css-color/css-break/css-flexbox
       * collapse of the first v4.1 run). Neither side may depend on
       * font-`normal` metrics, so the ref injection now pins an explicit
       * unitless 1.25 (capture-browser-ref.mjs REF_LINE_HEIGHT — 20px
       * @16px) and this rule pins the SAME value on the WPT stage, in
       * lock-step with the composed placeholder default
       * (ComponentRenderer.tsx WPT_COMPOSED_MODE '1.25') and the native
       * calibrations (Compose REF_DEFAULT_FONT_LINE_HEIGHT_RATIO 1.25,
       * SwiftUI wptRefLineBoxPx 20). Unitless so descendants recompute
       * against their own font-size exactly like the ref's inherited
       * number. IR-declared line-heights arrive as INLINE styles and
       * still win; the 327-pair stage sets no wpt class, so its
       * font-`normal` line boxes are byte-identical to before
       * (wpt-white-canvas.test.mjs pins this value against
       * REF_LINE_HEIGHT). */
      body.wpt-mode, body.wpt-mode #root,
      body.wpt-composed-mode, body.wpt-composed-mode #root {
        background: #fff;
        color: #000;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
        line-height: 1.25;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
