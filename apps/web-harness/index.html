<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Style Converter - Web Testing</title>
    <style>
      /* Inter — bundled and forced as the default font on every platform
       * (iOS / Android / web) so cross-platform SSIM isn't capped by
       * default-font divergence (SF Pro vs Roboto vs Chromium-default).
       * Loaded from /fonts/Inter-*.ttf which Vite serves from the public
       * directory at the same path. */
      @font-face {
        font-family: 'Inter';
        font-style: normal;
        font-weight: 400;
        font-display: block;
        src: url('/fonts/Inter-Regular.ttf') format('truetype');
      }
      @font-face {
        font-family: 'Inter';
        font-style: normal;
        font-weight: 500;
        font-display: block;
        src: url('/fonts/Inter-Medium.ttf') format('truetype');
      }
      @font-face {
        font-family: 'Inter';
        font-style: normal;
        font-weight: 700;
        font-display: block;
        src: url('/fonts/Inter-Bold.ttf') format('truetype');
      }
      @font-face {
        font-family: 'Inter';
        font-style: normal;
        font-weight: 900;
        font-display: block;
        src: url('/fonts/Inter-Black.ttf') format('truetype');
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      /* WPT mode override (F-G-HARNESS swarm-003 fix for
       * css-backgrounds__background-clip-009 and the wider css-backgrounds /
       * css-borders / css-sizing structural-divergence cluster). When the
       * capture URL carries `?wpt=1`, App.tsx adds `wpt-mode` to <body> in
       * addition to `capture-mode`. The CSS Backgrounds and Borders L3 §3.7
       * specification (`background-clip: border-box`) — and every other WPT
       * test built against the spec — assumes the browser-default box-sizing
       * of `content-box` (CSS2.1 §10.2). The universal-selector reset above
       * is load-bearing for the legacy 327-pair visual-test fixtures, but it
       * poisons any WPT test that combines a small / zero `width` with
       * non-trivial border or padding: `width: 0; border: 48px solid` MUST
       * produce a 96px outer box per the spec, but under border-box it
       * collapses to 0px wide and the background paints nothing.
       *
       * Scope: only `[data-component-id]` descendants — that's the set of
       * SDUI-rendered IR elements (every ComponentRenderer-emitted <div>
       * carries this attribute). The capture-canvas chrome wrapper, the
       * gallery scaffold, and the React app's own header / search / etc.
       * are unaffected because they do not carry `[data-component-id]`. */
      body.wpt-mode [data-component-id],
      body.wpt-mode [data-component-id] * {
        box-sizing: content-box;
      }
      /* WPT COMPOSED mode override (Round-4 TITAN GAP 1 — UA default margins).
       * When the capture URL carries `?wptComposed=1`, App.tsx adds
       * `wpt-composed-mode` to <body>. The browser-ref (capture-browser-ref.mjs)
       * renders each WPT reference page with the FULL UA stylesheet intact —
       * so a <p> bar keeps its 1em (≈16px) block margins and adjacent bars
       * collapse to a real ~16px gap. Our composed capture renders the same
       * bars as <p data-component-id> elements, but the universal `* { margin:
       * 0 }` reset above zeroes those UA margins → the bars render FLUSH and a
       * 10-bar test (background-color-hsl-001 etc.) scores far below the ref.
       *
       * Fix: on the IR-rendered elements ONLY (`[data-component-id]` and their
       * descendants), roll the margin cascade back to the user-agent origin
       * with `margin: revert`. `revert` restores the exact UA default per tag
       * — 1em block margins for <p>/<h*>, the list margins for <ul>/<ol>, 0 for
       * <div>/<span> — reproducing the ref's native layout. IR-declared margins
       * still win: they arrive as INLINE styles (higher priority than this
       * stylesheet rule), so a component that sets its own margin is unaffected
       * — only the UA default is restored where the IR is silent.
       *
       * Scope: `wpt-composed-mode` is set ONLY under `?wptComposed=1`, so the
       * legacy per-component WPT path (`?wpt=1` alone) and the committed
       * 327-pair visual baseline (no WPT class at all) keep the flush reset. */
      body.wpt-composed-mode [data-component-id],
      body.wpt-composed-mode [data-component-id] * {
        margin: revert;
      }
      html, body {
        width: 100%;
        height: 100%;
        background: #111;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
        color: #eee;
        overflow: hidden;
      }
      body {
        display: flex;
        justify-content: center;
        padding-top: 20px;
      }
      #root {
        width: 390px;
        max-width: 390px;
        min-width: 390px;
        height: 844px;
        overflow-y: auto;
        overflow-x: hidden;
        background: #1a1a2e;
        border: 1px solid rgba(255,255,255,0.15);
        border-radius: 12px;
      }
      /* Capture mode: a flat list of chromeless canvases with NO phone-frame
       * border, rounded corners, or scroll container. The CaptureGallery JS
       * toggles `<body class="capture-mode">` before the first paint. */
      body.capture-mode {
        padding-top: 0;
        justify-content: flex-start;
        overflow: visible;
      }
      body.capture-mode,
      body.capture-mode html {
        background: #1a1a2e;
        height: auto;
      }
      body.capture-mode #root {
        width: 390px;
        min-width: 390px;
        max-width: 390px;
        height: auto;
        overflow: visible;
        border: none;
        border-radius: 0;
        background: #1a1a2e;
      }
      /* WPT capture stage — the corpus-v4 WHITE canvas. WPT reftests are
       * authored against the spec-default white page: white ink (borders,
       * backgrounds) is supposed to VANISH into the canvas, and the
       * browser-ref (capture-browser-ref.mjs CANVAS_BG) renders white too.
       * The dark stage above made that ink visible only in our captures —
       * a systematic reftest penalty. `wpt-mode` / `wpt-composed-mode` are
       * added by App.tsx ONLY under `?wpt=1` / `?wptComposed=1`, so the
       * legacy 327-pair capture path (bare `capture-mode`) keeps the dark
       * #1a1a2e stage byte-identically. Declared AFTER the capture-mode
       * rules so equal-specificity cascade order makes white win when both
       * classes are present. Default text `color` is NOT overridden here —
       * the ref injection keeps `color:#fff` and every runtime bottoms out
       * near-white (#eee), so default-ink prose stays symmetric (see
       * capture-browser-ref.mjs's injection note). */
      body.wpt-mode, body.wpt-mode #root,
      body.wpt-composed-mode, body.wpt-composed-mode #root {
        background: #fff;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
